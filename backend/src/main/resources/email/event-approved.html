<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{titulo}}</title>
</head>
<body style="margin:0; padding:0; background-color:#fda49cff; font-family:Arial, sans-serif; color:#fda49cff;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#fda49cff; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%; max-width:600px; background:#ffffff;">
          <tr>
            <td style="background:#fda49cff; color:#ffffff; padding:20px 24px; font-size:20px; font-weight:bold; letter-spacing:0.4px; flex-direction:row; display:flex; align-items:center; gap:12px; justify-content: center;">
              
              AdotaAi.pet
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <h1 style="margin:0 0 12px; font-size:22px; color:#fda49cff;">{{titulo}}</h1>
              <p style="margin:0 0 14px; font-size:15px; line-height:1.5; color:#fda49cff;">Olá {{usuario_nome}},</p>
              <p style="margin:0 0 10px; font-size:15px; line-height:1.5; color:#fda49cff;">Seu evento <strong>{{evento_nome}}</strong> foi aprovado.</p>
              <p style="margin:0 0 18px; font-size:15px; line-height:1.5; color:#fda49cff;">Data: {{evento_data}}</p>
              <a href="{{cta_url}}" style="display:inline-block; background:#fda49cff; color:#ffffff; text-decoration:none; padding:12px 18px; border-radius:8px; font-weight:bold; font-size:14px;">{{cta_texto}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px; background:#ffffff; font-size:12px; color:#fda49cff;">
              Se voce nao solicitou esta ação, ignore este email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
