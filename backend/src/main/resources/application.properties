spring.application.name=adotaai

spring.datasource.url=jdbc:postgresql://localhost:5432/projeto
spring.datasource.username=postgres
spring.datasource.password=root


spring.jpa.database-plataform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXlGb3JBZG90YUFpUGV0QXBwbGljYXRpb25TZWNyZXRLZXkyMDI0ITEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# Email Configuration (configure with your SMTP settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

