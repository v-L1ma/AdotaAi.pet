spring.application.name=adotaai

spring.datasource.url=jdbc:postgresql://localhost:5432/adotaai_db
spring.datasource.username=postgres
spring.datasource.password=1404


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXlGb3JBZG90YUFpUGV0QXBwbGljYXRpb25TZWNyZXRLZXkyMDI0ITEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# Email Configuration (configure with your SMTP settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:pets}
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:}
supabase.s3.region=${SUPABASE_S3_REGION:us-east-1}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}

# Upload de imagem
app.image.max-bytes=${APP_IMAGE_MAX_BYTES:8388608}

