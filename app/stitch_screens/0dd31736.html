<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

              "surface-tint": "#ae2f34",

              "on-error": "#ffffff",
              "secondary": "#5e5e5e",
              "outline-variant": "#e0bfbd",

              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#ffb3b0",
              "tertiary-fixed": "#72fbbc",
              "on-surface": "#191c1d",
              "surface-variant": "#e1e3e4",
              "surface-container": "#edeeef",
              "inverse-primary": "#ffb3b0",
              "primary": "#ae2f34",
              "on-primary-fixed": "#410006",
              "surface": "#f8f9fa",
              "on-tertiary-container": "#003b26",
              "surface-container-highest": "#e1e3e4",
              "error-container": "#ffdad6",
              "on-primary-fixed-variant": "#8c1520",
              "tertiary-fixed-dim": "#52dea2",
              "outline": "#8c706f",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#c8c6c6",

              "surface-container-lowest": "#ffffff"

            fontFamily: {
              "headline": ["Plus Jakarta Sans"],

              "label": ["Manrope"]

            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },

      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- Top Navigation -->
<header class="bg-[#f8f9fa] dark:bg-slate-900/80 backdrop-blur-xl docked full-width top-0 z-50 flex justify-between items-center w-full px-6 h-16">
<button class="text-[#ae2f34] dark:text-[#ff6b6b] active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-slate-500">Criar Anúncio</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-2xl mx-auto px-6 pt-8 pb-32">
<!-- Identity Section (Editorial Empathy) -->
<section class="mb-12 text-center">
<div class="relative inline-block group">
<div class="w-40 h-40 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border-4 border-surface-container-lowest shadow-lg transition-transform hover:scale-105 duration-300">
<!-- Placeholder logic with icon -->
<div class="flex flex-col items-center gap-1 text-outline">
<span class="material-symbols-outlined text-4xl" data-icon="add_a_photo">add_a_photo</span>
<span class="text-[10px] font-bold uppercase tracking-widest font-label">Adicionar Foto</span>
</div>
<!-- Reference Image (Visual Guide) -->
<img class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-20 transition-opacity" data-alt="Close up of a cute puppy for profile picture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBL_zCXTvgKKgDuDt5jz9Fqi7ECuJgYyp9boKFWAOhwLqHLJsrDGSoACe7HS5e-r-6gWLJhaG77TuW4ppkQRwrhAeqHiTusIKs5UmUy_wUNfMjCyT4zPuyZDDIQi8KXfI4Ag0SvBu_UOMGcieVXEXGSZK_byIOz8M1U81WYmWE1KWsES_GABgMDEtzQcAV30uG_qr04mJgCIEyN9AeXfE31cLMvT57wborP8HcADFi90yibxwuO6rVqBhr7dH-Z2LZO_vvKNW0HvcE"/>
</div>
<div class="absolute bottom-1 right-1 bg-primary text-on-primary p-2 rounded-full shadow-md">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</div>
</div>
<div class="mt-6">
<h2 class="text-3xl font-extrabold tracking-tighter text-primary">Nova História</h2>
<p class="text-secondary font-body mt-2">Dê voz a um novo companheiro</p>
</div>
</section>
<!-- Form Canvas -->
<form class="space-y-10">
<!-- Basic Info Group -->
<div class="space-y-6 bg-surface-container-low p-8 rounded-[32px]">
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-widest text-primary font-label px-1">Nome do Pet</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-body shadow-sm focus:ring-2 focus:ring-primary-container transition-all" placeholder="Como ele se chama?" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-widest text-primary font-label px-1">Idade</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-body shadow-sm focus:ring-2 focus:ring-primary-container transition-all" placeholder="Ex: 2 anos" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-[10px] font-bold uppercase tracking-widest text-primary font-label px-1">Peso (kg)</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-4 text-body shadow-sm focus:ring-2 focus:ring-primary-container transition-all" placeholder="Ex: 5" type="number"/>
</div>
</div>
</div>
<!-- Species & Size Selection (Chips UI) -->
<div class="space-y-8">
<div class="space-y-4">
<h3 class="text-sm font-bold tracking-tight text-on-surface px-1">Espécie</h3>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-3 rounded-full bg-primary text-on-primary shadow-lg shadow-primary-container/30 flex items-center gap-2 transition-all" type="button">
<span class="material-symbols-outlined text-lg" data-icon="dog">pets</span>
<span class="text-sm font-bold">Cão</span>
</button>
<button class="px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container hover:bg-surface-variant flex items-center gap-2 transition-all" type="button">
<span class="material-symbols-outlined text-lg" data-icon="cat">pets</span>
<span class="text-sm font-bold">Gato</span>
</button>
<button class="px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container hover:bg-surface-variant flex items-center gap-2 transition-all" type="button">
<span class="material-symbols-outlined text-lg" data-icon="pets">pets</span>
<span class="text-sm font-bold">Outros</span>
</button>
</div>
</div>
<div class="space-y-4">
<h3 class="text-sm font-bold tracking-tight text-on-surface px-1">Porte</h3>
<div class="flex gap-2 p-1 bg-surface-container-low rounded-2xl w-full">
<button class="flex-1 py-3 text-sm font-bold text-on-surface-variant hover:bg-surface-container-lowest rounded-xl transition-all" type="button">Pequeno</button>
<button class="flex-1 py-3 text-sm font-bold bg-surface-container-lowest text-primary shadow-sm rounded-xl transition-all" type="button">Médio</button>
<button class="flex-1 py-3 text-sm font-bold text-on-surface-variant hover:bg-surface-container-lowest rounded-xl transition-all" type="button">Grande</button>
</div>
</div>
</div>
<!-- Narrative Section -->
<div class="space-y-4">
<div class="flex items-center justify-between px-1">
<h3 class="text-sm font-bold tracking-tight text-on-surface">Descrição &amp; História</h3>
<span class="text-[10px] font-bold text-outline uppercase tracking-widest">Opcional</span>
</div>
<textarea class="w-full bg-surface-container-low border-none rounded-[24px] px-6 py-6 text-body shadow-sm focus:ring-2 focus:ring-primary-container transition-all resize-none" placeholder="Conte um pouco sobre a personalidade, temperamento e o que o torna especial..." rows="5"></textarea>
</div>
<!-- Visual Reference/Asset Section (Editorial Feel) -->
<div class="relative h-48 rounded-[32px] overflow-hidden group">
<img class="w-full h-full object-cover" data-alt="A happy golden retriever with its owner in a park" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxIF2Im8WNByvs3SLrp7xUcHjIAD_FKYDbSk4wtqoDHbsWdcfFrzzFVFQ-2WjKQ4c0Tf_-ayTxT_BxWcmuubEcH5VhW8p8qa-DsZIt41JuNEknk62B0WoCZnWpOZ9oB63FijgVmCW4pJkN38z3pgR074VIm0DspwrIlWJZCdiLAlua2ErYt_W28XFS7ArMecdTnmJdLuGgNhkPJTsBQ2b4cTkxMHCA5c3Np6427be3rD5Lqv0llIKO94f0RVm31Q6mLZ9pp2MUXIo"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex items-end p-6">
<p class="text-on-primary font-headline font-bold text-lg leading-tight">Boas fotos aumentam as chances de adoção em até 80%.</p>
</div>
</div>
<!-- Action Button -->
<div class="pt-6">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary py-5 rounded-2xl font-bold text-lg shadow-xl shadow-primary-container/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
                    Criar Anúncio
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Bar (Contextual Lock) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-8 pb-8 pt-4 bg-[#f8f9fa]/80 dark:bg-slate-900/80 backdrop-blur-xl z-50 rounded-t-[32px] shadow-[0px_-12px_32px_rgba(25,28,29,0.06)] md:hidden">
<a class="flex items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
</a>
<a class="flex items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
</a>
<a class="flex items-center justify-center bg-[#ff6b6b] dark:bg-[#ae2f34] text-white rounded-2xl p-3 shadow-lg shadow-[#ff6b6b]/20 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
</a>
<a class="flex items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
</a>
</nav>
</body></html>
